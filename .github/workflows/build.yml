name: Build & Push Images

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read
  packages: write

jobs:
  build-frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Lowercase image prefix
        run: echo "IMAGE_PREFIX=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push frontend
        uses: docker/build-push-action@v6
        with:
          context: ./storefront
          file: ./storefront/src/frontend/Dockerfile
          push: true
          build-args: |
            NEXT_PUBLIC_EMBRACE_APP_ID=${{ vars.EMBRACE_APP_ID }}
          tags: |
            ${{ env.IMAGE_PREFIX }}/frontend:latest
            ${{ env.IMAGE_PREFIX }}/frontend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push frontend-proxy
        uses: docker/build-push-action@v6
        with:
          context: ./storefront
          file: ./storefront/src/frontend-proxy/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}/frontend-proxy:latest
            ${{ env.IMAGE_PREFIX }}/frontend-proxy:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push shipping
        uses: docker/build-push-action@v6
        with:
          context: ./storefront
          file: ./storefront/src/shipping/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}/shipping:latest
            ${{ env.IMAGE_PREFIX }}/shipping:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-traffic-gen:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Lowercase image prefix
        run: echo "IMAGE_PREFIX=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push traffic-gen
        uses: docker/build-push-action@v6
        with:
          context: ./traffic-gen
          file: ./traffic-gen/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}/traffic-gen:latest
            ${{ env.IMAGE_PREFIX }}/traffic-gen:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
