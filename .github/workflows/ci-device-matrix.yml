name: Device Matrix

on:
  workflow_dispatch:

concurrency:
  group: ci-device-matrix
  cancel-in-progress: true

jobs:
  device:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      EMBRACE_APP_ID: ${{ vars.EMBRACE_APP_ID }}
      RUN_SOURCE: matrix-${{ matrix.device }}
      TRAFFIC_DEVICE_OVERRIDE: ${{ matrix.device }}
      TRAFFIC_WORKER_COUNT: 1
      TRAFFIC_SESSION_GAP_MS: 2000
      TRAFFIC_LOG_LEVEL: info
      TRAFFIC_CHAOS_RATE: 0.05
      TRAFFIC_MAX_SESSIONS: 5
    strategy:
      matrix:
        device: [desktop-1080p, iphone-14, pixel-7, macbook-13]
      fail-fast: false
      max-parallel: 2
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Start storefront stack
        run: docker compose up -d

      - name: Wait for storefront to be healthy
        run: |
          echo "Waiting for frontend-proxy on port 8080..."
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:8080 > /dev/null 2>&1; then
              echo "Storefront is healthy after ${i}s"
              break
            fi
            if [ "$i" -eq 60 ]; then
              echo "Storefront failed to start within 60s"
              docker compose logs frontend frontend-proxy
              exit 1
            fi
            sleep 1
          done

      - name: Run traffic generator (5 sessions per device)
        run: |
          docker compose --profile traffic up traffic-gen
          echo "Traffic generator exited"

      - name: Capture traffic logs
        if: always()
        run: docker compose logs traffic-gen > traffic-${{ matrix.device }}.log 2>&1

      - name: Upload traffic logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: traffic-log-${{ matrix.device }}
          path: traffic-${{ matrix.device }}.log
          retention-days: 7

      - name: Tear down
        if: always()
        run: docker compose --profile traffic down -v
