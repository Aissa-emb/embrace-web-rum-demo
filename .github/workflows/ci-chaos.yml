name: High-Chaos Sessions

on:
  schedule:
    - cron: '0 */3 * * *'
  workflow_dispatch:

concurrency:
  group: ci-chaos
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read
  packages: read

jobs:
  chaos:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      EMBRACE_APP_ID: ${{ vars.EMBRACE_APP_ID }}
      RUN_SOURCE: chaos
      TRAFFIC_WORKER_COUNT: 2
      TRAFFIC_SESSION_GAP_MS: 1500
      TRAFFIC_LOG_LEVEL: info
      TRAFFIC_CHAOS_RATE: 0.6
      TRAFFIC_MAX_DURATION_S: 600
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup environment
        run: |
          cp storefront/.env .env
          echo "CUSTOM_IMAGE_NAME=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: Pull pre-built images
        run: docker compose pull --ignore-pull-failures

      - name: Start storefront stack
        run: docker compose up -d

      - name: Wait for storefront to be healthy
        run: |
          echo "Waiting for frontend-proxy on port 8080..."
          for i in $(seq 1 120); do
            if curl -fsS http://localhost:8080 > /dev/null 2>&1; then
              echo "Storefront is healthy after ${i}s"
              break
            fi
            if [ "$i" -eq 120 ]; then
              echo "Storefront failed to start within 120s"
              docker compose logs frontend frontend-proxy
              exit 1
            fi
            sleep 1
          done

      - name: Start traffic generator (high chaos)
        run: docker compose --profile traffic up -d traffic-gen

      - name: Wait for traffic generation (~10 min)
        run: |
          echo "Traffic generator running with 60% chaos rate for 600s..."
          sleep 620
          echo "Done waiting"

      - name: Capture traffic logs
        if: always()
        run: docker compose logs traffic-gen > traffic-chaos.log 2>&1

      - name: Upload traffic logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: traffic-log-chaos
          path: traffic-chaos.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Tear down
        if: always()
        run: docker compose --profile traffic down -v
